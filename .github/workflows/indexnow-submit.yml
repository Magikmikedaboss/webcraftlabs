name: Submit IndexNow URLs

on:
  push:
    branches:
      - main
    paths:
      - "src/content/blog/**"
      - "src/content/news/**"
      - "src/app/sitemap.ts"
      - "src/app/api/indexnow/**"
  workflow_dispatch:

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    env:
      INDEXNOW_ENDPOINT: ${{ secrets['INDEXNOW_ENDPOINT'] }}
      INDEXNOW_SUBMIT_TOKEN: ${{ secrets['INDEXNOW_SUBMIT_TOKEN'] }}
    steps:
      - name: Submit sitemap URLs to IndexNow endpoint
        run: |
          set -euo pipefail
          if [ -z "${INDEXNOW_ENDPOINT:-}" ] || [ -z "${INDEXNOW_SUBMIT_TOKEN:-}" ]; then
            echo "INDEXNOW_ENDPOINT or INDEXNOW_SUBMIT_TOKEN is missing."
            echo "Set both secrets to enable automatic IndexNow submission."
            exit 0
          fi

          curl --fail --show-error --silent \
            -X POST "$INDEXNOW_ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "x-indexnow-token: $INDEXNOW_SUBMIT_TOKEN" \
            -d '{}'
          echo "IndexNow submission triggered successfully."
