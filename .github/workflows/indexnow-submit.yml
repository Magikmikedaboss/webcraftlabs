name: Submit IndexNow URLs

on:
  push:
    branches:
      - main
    paths:
      - "src/app/page.tsx"
      - "src/app/about/page.tsx"
      - "src/app/contact/page.tsx"
      - "src/app/portfolio/page.tsx"
      - "src/app/build/page.tsx"
      - "src/app/blog/page.tsx"
      - "src/app/news/page.tsx"
      - "src/content/blog/**"
      - "src/content/news/**"
      - "src/app/sitemap.ts"
      - "src/app/layout.tsx"
      - "src/components/SiteShell.tsx"
      - "src/components/services/ServicePageTemplate.tsx"
      - "src/components/services/LocalServiceStubPage.tsx"
      - "next.config.mjs"
      - "src/app/api/indexnow/**"
      - "src/app/knowledge/page.tsx"
      - "src/app/archive/**"
      - "src/app/services/**"
      - "src/app/build/page.tsx"
      - "src/app/las-vegas-web-design/page.tsx"
      - "src/app/services/**"
      - "src/lib/mdx/blog.ts"
      - "src/lib/mdx/news.ts"
      - "src/lib/rss.ts"
  workflow_dispatch:

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      INDEXNOW_ENDPOINT: ${{ secrets.INDEXNOW_ENDPOINT }}
      INDEXNOW_SUBMIT_TOKEN: ${{ secrets.INDEXNOW_SUBMIT_TOKEN }}
    steps:
      - name: Submit sitemap URLs to IndexNow endpoint
        run: |
          set -euo pipefail
          if [ -z "${INDEXNOW_ENDPOINT:-}" ] || [ -z "${INDEXNOW_SUBMIT_TOKEN:-}" ]; then
            echo "INDEXNOW_ENDPOINT or INDEXNOW_SUBMIT_TOKEN is missing."
            echo "Set both secrets to enable automatic IndexNow submission."
            exit 0
          fi

          if [[ "$INDEXNOW_ENDPOINT" != https://* ]]; then
            echo "INDEXNOW_ENDPOINT must use https://."
            exit 1
          fi

          curl --fail --show-error --silent --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            -X POST "$INDEXNOW_ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "x-indexnow-token: $INDEXNOW_SUBMIT_TOKEN" \
            -d '{}'
          echo "IndexNow submission triggered successfully."